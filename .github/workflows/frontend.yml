# Testa, gera e publica o front React no GitHub Pages (gratuito em repositório público).
# Roda a cada push na main que altere frontend/, ou manualmente (aba Actions).
#
# Configuração (Settings do repositório):
#   - Pages > Build and deployment > Source: "GitHub Actions"
#   - Secrets and variables > Actions > Variables > API_URL (opcional):
#     URL da API exibida por `chalice url`. Sem ela, informe a API abrindo o site com
#     ?api=<URL>, o que fica salvo no navegador.
name: Front-end (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
